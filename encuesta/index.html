<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#d7192b">
<meta name="robots" content="noindex">
<title>Encuesta · Mundialito Alianza</title>
<link rel="icon" href="/logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--red:#d7192b;--red2:#9e0e1d;--ink:#1d1d1f;--ink2:#5e3a3d;--muted:#8a7a7b;--line:#eee3e4;--soft:#fdf2f3;--bg:#f6f4f6;--ok:#16a34a;--star:#f59e0b}
*{box-sizing:border-box}html,body{margin:0}body{font-family:Inter,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15.5px;line-height:1.5}
button,input,select,textarea{font:inherit}
.hd{background:linear-gradient(150deg,#d7192b,#9e0e1d);color:#fff;padding:26px 18px 70px;text-align:center}
.hd a{display:inline-flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-weight:900;letter-spacing:.06em;text-transform:uppercase;font-size:13px}
.hd a img{width:30px;height:36px;object-fit:contain;filter:brightness(0) invert(1)}
.hd small{display:block;margin-top:22px;font-size:12.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.hd h1{margin:6px auto 0;font-size:clamp(26px,6vw,38px);font-weight:900;line-height:1.1;max-width:680px}
.hd p{margin:10px auto 0;max-width:520px;opacity:.9;font-weight:600}
.wrap{max-width:680px;margin:-44px auto 0;padding:0 14px 60px}
.card{background:#fff;border-radius:22px;padding:24px 22px;box-shadow:0 18px 40px rgba(110,0,0,.08);border:1px solid var(--line)}
.sec{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}.sec:first-of-type{margin-top:0;padding-top:0;border:0}
.sec>b{display:block;font-size:12px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--red2);margin-bottom:10px}
.g2{display:grid;gap:12px;grid-template-columns:1fr 1fr}@media (max-width:560px){.g2{grid-template-columns:1fr}}
label.f{display:block;font-size:13px;font-weight:800;color:var(--ink2)}label.f .i{display:block;margin-top:6px}label.f i{font-style:normal;color:var(--red)}
.i{width:100%;padding:12px 13px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font-size:16px}.i:focus{outline:none;border-color:var(--red)}
textarea.i{resize:vertical;min-height:100px}
.q{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #f6eeef;flex-wrap:wrap}
.q:last-child{border:0}
.q>span{font-weight:800}
.st{display:flex;gap:4px;align-items:center}
.st button{border:0;background:none;padding:3px;cursor:pointer;line-height:0}
.st svg{width:32px;height:32px;fill:#efe6e7;stroke:none;transition:transform .15s}
.st button.on svg{fill:var(--star)}
.st button:active svg{transform:scale(.85)}
.st .na{font-size:12px;font-weight:800;color:var(--muted);border:1.5px solid var(--line);border-radius:99px;padding:6px 10px;margin-left:6px;line-height:1}
.st .na.on{background:var(--ink);border-color:var(--ink);color:#fff}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opts button{flex:1;min-width:90px;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px;font-weight:900;cursor:pointer}
.opts button.on{border-color:var(--red);background:var(--soft);color:var(--red2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:15px 22px;font-weight:900;font-size:16px;cursor:pointer;background:var(--red);color:#fff;text-decoration:none}
.btn:hover{background:var(--red2)}.btn:disabled{opacity:.6;cursor:wait}.btn.l{background:#fff;color:var(--red2);box-shadow:inset 0 0 0 1.5px #f0cfd3}
.btn.w{width:100%;margin-top:22px}
.priv{font-size:12.5px;color:var(--muted);margin:12px 0 0;text-align:center}
.err{color:var(--red);font-weight:800;font-size:13.5px;margin-top:10px;text-align:center;min-height:1em}
.msg{text-align:center;padding:12px 4px}
.msg svg{width:58px;height:58px;fill:none;stroke:var(--ok);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;background:#f0fdf4;border-radius:50%;padding:12px}
.msg h2{font-size:22px;margin:14px 0 6px}.msg p{color:var(--ink2);margin:0 auto 18px;max-width:440px}
.skel{height:280px;border-radius:22px;background:linear-gradient(90deg,#fff,#f8eef0,#fff);background-size:200% 100%;animation:sk 1.2s infinite}@keyframes sk{to{background-position:-200% 0}}
p,li,figcaption,blockquote,small,dd{text-wrap:pretty}h1,h2,h3,h4{text-wrap:balance}
</style>
</head>
<body>
<header class="hd"><a href="/"><img src="/logo.webp" alt="">Mundialito Alianza</a><small>Encuesta a las delegaciones</small><h1 id="tit">¿Cómo te fue?</h1><p>Son dos minutos. Lo que nos cuentes nos ayuda a que el próximo torneo sea todavía mejor.</p></header>
<main class="wrap"><div id="box"><div class="skel"></div></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/config.js?v=20261117f"></script>
<script>
const CFG=window.MUNDIALITO_CFG,sb=supabase.createClient(CFG.url,CFG.key),$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Las mismas preguntas que lee el panel (/gestion → Encuesta)
const PREG=[['org','Organización general'],['fix','Fixture y horarios'],['can','Estado de las canchas'],['arb','Arbitraje'],['alo','Alojamiento',1],['com','Comidas',1],['ate','Atención de la organización']];
const STAR='<svg viewBox="0 0 24 24"><path d="M12 2.8l2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2l-5.6 3 1.1-6.3L2.9 9.5l6.3-.9z"/></svg>',OK='<svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg>';
let T=null,R={};const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const gracias=()=>`<div class="card msg">${OK}<h2>¡Gracias por tu respuesta!</h2><p>La leemos con todo el equipo de la organización. Nos vemos en el próximo torneo.</p><a class="btn" href="/">Ir al inicio</a></div>`;
async function init(){let id=new URLSearchParams(location.search).get('t');let {data}=id?await sb.from('torneos_publicos').select('*').eq('id',id).maybeSingle():{data:null};T=data;
 if(T){$('#tit').textContent='¿Cómo te fue en el '+T.nombre+'?';document.title='Encuesta · '+T.nombre}
 if(!T||!(T.config||{}).encuesta){$('#box').innerHTML=`<div class="card msg"><h2>La encuesta no está abierta</h2><p>${T?'Todavía no se puede responder la encuesta del '+esc(T.nombre)+'.':'No encontramos ese torneo.'}</p><a class="btn l" href="/">Ir al inicio</a></div>`;return}
 if(ls.get('enc-'+T.id)){$('#box').innerHTML=gracias();return}
 let cats=T.categorias||[];
 $('#box').innerHTML=`<form class="card" onsubmit="return enviar(event)" novalidate>
 <div class="sec"><b>Sobre vos</b><div class="g2"><label class="f">Club <i>*</i><input class="i" name="club" required maxlength="100" autocomplete="organization"></label><label class="f">Participaste como<select class="i" name="rol"><option>Delegado</option><option>Entrenador</option><option>Familia</option><option>Jugador</option><option>Otro</option></select></label>${cats.length>1?`<label class="f" style="grid-column:1/-1">Categoría<select class="i" name="cat"><option value="">—</option>${cats.map(c=>`<option>${esc(c)}</option>`).join('')}</select></label>`:''}</div></div>
 <div class="sec"><b>Puntuá del 1 al 5</b>${PREG.map(([k,l,na])=>`<div class="q"><span>${l}</span><div class="st" data-k="${k}">${[1,2,3,4,5].map(n=>`<button type="button" aria-label="${n} de 5" onclick="pun('${k}',${n})">${STAR}</button>`).join('')}${na?`<button type="button" class="na" onclick="pun('${k}','na')">No usé</button>`:''}</div></div>`).join('')}</div>
 <div class="sec"><b>¿Volverían a participar?</b><div class="opts" data-k="volver">${[['si','Sí'],['talvez','Tal vez'],['no','No']].map(([v,l])=>`<button type="button" onclick="opt('volver','${v}')" data-v="${v}">${l}</button>`).join('')}</div></div>
 <div class="sec"><b>Contanos</b><label class="f">¿Qué te gustó y qué mejorarías?<textarea class="i" name="comentario" maxlength="1500"></textarea></label></div>
 <button class="btn w" type="submit">Enviar respuesta</button><div class="err" id="err"></div><p class="priv">Las respuestas solo las ve la organización.</p></form>`}
function pun(k,n){R[k]=n;document.querySelectorAll(`.st[data-k="${k}"] button`).forEach((b,i)=>b.classList.toggle('on',n!=='na'&&!b.classList.contains('na')&&i<n));document.querySelector(`.st[data-k="${k}"] .na`)?.classList.toggle('on',n==='na')}
function opt(k,v){R[k]=v;document.querySelectorAll(`.opts[data-k="${k}"] button`).forEach(b=>b.classList.toggle('on',b.dataset.v===v))}
async function enviar(e){e.preventDefault();let F=e.target,club=F.club.value.trim();if(!club){$('#err').textContent='Contanos de qué club sos.';return false}if(!PREG.some(([k])=>R[k])){$('#err').textContent='Puntuá al menos una de las preguntas.';return false}
 let b=F.querySelector('button[type=submit]');b.disabled=true;b.textContent='Enviando…';let resp={...R};if(F.cat&&F.cat.value)resp.cat=F.cat.value;
 let {error}=await sb.from('encuesta_respuestas').insert({torneo_id:T.id,club,rol:F.rol.value,respuestas:resp,comentario:F.comentario.value.trim()});
 if(error){console.error(error);b.disabled=false;b.textContent='Enviar respuesta';$('#err').textContent='No se pudo enviar. Revisá la conexión y probá de nuevo.';return false}
 ls.set('enc-'+T.id,'1');$('#box').innerHTML=gracias();scrollTo(0,0);return false}
init();
</script>
</body>
</html>
