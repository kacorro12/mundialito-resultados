<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Panel de fixture · Mundialito Alianza</title>
<link rel="icon" href="/logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--red:#d7192b;--red2:#9e0e1d;--ink:#1d1d1f;--ink2:#5e3a3d;--muted:#8a7a7b;--line:#eee3e4;--soft:#fdf2f3;--bg:#f6f4f6;--ok:#16a34a;--amber:#b45309}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
button,input,select{font:inherit}
.hidden{display:none!important}
/* Ingreso */
.gate{min-height:100svh;display:grid;place-items:center;padding:20px;background:linear-gradient(160deg,#d7192b,#9e0e1d)}
.gate form{width:min(380px,100%);background:#fff;border-radius:24px;padding:30px 26px;text-align:center;box-shadow:0 30px 70px rgba(0,0,0,.3)}
.gate img{width:54px;height:64px;object-fit:contain}
.gate h1{margin:12px 0 4px;font-size:22px;font-weight:900}
.gate p{margin:0 0 18px;color:var(--muted);font-size:13.5px}
.gate input{width:100%;padding:14px;border:1.5px solid var(--line);border-radius:12px;font-size:16px;text-align:center}
.gate input:focus{outline:none;border-color:var(--red)}
.gate .err{min-height:20px;margin:10px 0 0;color:var(--red);font-weight:700;font-size:13px}
/* General */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:11px;padding:10px 14px;font-weight:800;cursor:pointer;background:var(--red);color:#fff;white-space:nowrap}
.btn:hover{background:var(--red2)}
.btn.l{background:#fff;color:var(--red2);box-shadow:inset 0 0 0 1.5px #f0cfd3}
.btn.l:hover{background:var(--soft)}
.btn.g{background:var(--ok)}
.btn.s{padding:7px 10px;font-size:12.5px;border-radius:9px}
.btn.x{background:transparent;color:var(--muted);padding:6px 8px}
.btn.x:hover{color:var(--red);background:var(--soft)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.gate .btn{width:100%;margin-top:14px;padding:14px}
input.i,select.i{width:100%;padding:9px 10px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);min-width:0}
input.i:focus,select.i:focus{outline:none;border-color:var(--red)}
label.f{display:flex;flex-direction:column;gap:5px;font-size:11.5px;font-weight:800;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em}
/* Barra */
.top{position:sticky;top:0;z-index:20;background:linear-gradient(120deg,#d7192b,#9e0e1d);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:0 6px 20px rgba(110,0,0,.25)}
.top .brand{display:flex;align-items:center;gap:9px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;font-size:14px}
.top .brand img{width:26px;height:31px;object-fit:contain;filter:brightness(0) invert(1)}
.top .brand small{display:block;font-size:10.5px;font-weight:700;letter-spacing:.12em;opacity:.85}
.top select{max-width:340px;background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:10px;padding:8px 10px;font-weight:700}
.top select option{color:#1d1d1f}
.top .sp{flex:1}
.top .btn.l{box-shadow:none}
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 120px}
.main .card{max-width:1100px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 10px 30px rgba(110,0,0,.05);margin-bottom:16px}
.card h2{margin:0 0 14px;font-size:17px;font-weight:900;display:flex;align-items:center;gap:10px}
.card h2 small{font-weight:700;color:var(--muted);font-size:12.5px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--soft);color:var(--red2);font-weight:800;border-radius:99px;padding:6px 6px 6px 12px;font-size:13px}
.chip button{border:0;background:#fff;color:var(--red2);border-radius:50%;width:22px;height:22px;cursor:pointer;font-weight:900}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{border:0;background:#fff;border:1.5px solid var(--line);border-radius:99px;padding:8px 14px;font-weight:800;cursor:pointer;color:var(--ink2)}
.tabs button.on{background:var(--red);border-color:var(--red);color:#fff}
.tabs.sub button{border-radius:10px;padding:7px 12px;font-size:13px}
.tabs.sub button.on{background:#1d1d1f;border-color:#1d1d1f}
.empty{padding:26px;text-align:center;color:var(--muted);font-weight:700;border:1.5px dashed var(--line);border-radius:14px}
.note{font-size:12.5px;color:var(--muted);margin:8px 0 0}
.switch{display:inline-flex;align-items:center;gap:10px;font-weight:800;cursor:pointer}
.switch input{width:44px;height:24px;appearance:none;background:#ddd;border-radius:99px;position:relative;cursor:pointer;transition:.2s}
.switch input:before{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
.switch input:checked{background:var(--ok)}
.switch input:checked:before{left:23px}
/* Partidos */
.day{margin:18px 0 8px;font-size:13px;font-weight:900;color:var(--red2);text-transform:uppercase;letter-spacing:.08em}
.m{display:grid;grid-template-columns:62px 1fr auto 1fr;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:#fff;margin-bottom:8px}
.m.dirty{border-color:var(--amber);background:#fffbeb}
.m.done{background:#f7fdf9;border-color:#cdeedb}
.m .meta{font-size:11.5px;font-weight:800;color:var(--muted);line-height:1.35}
.m .meta b{display:block;color:var(--ink);font-size:14px}
.m .tm{font-weight:800;font-size:13.5px;line-height:1.2}
.m .tm.h{text-align:right}
.m .tm small{display:block;font-size:11px;font-weight:700;color:var(--muted)}
.m .sc{display:flex;align-items:center;gap:6px}
.m .sc input{width:46px;height:42px;text-align:center;font-size:18px;font-weight:900;border:1.5px solid var(--line);border-radius:10px}
.m .sc input:focus{outline:none;border-color:var(--red)}
.m .pen{grid-column:1/-1;display:flex;justify-content:center;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--ink2)}
.m .pen input{width:40px;height:32px;text-align:center;font-weight:900;border:1.5px solid var(--line);border-radius:8px}
.m .ph{grid-column:1/-1;font-size:11px;font-weight:900;color:var(--red2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:-4px}
.save{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-top:1px solid var(--line);transform:translateY(110%);transition:transform .25s}
.save.on{transform:none}
.save span{align-self:center;font-weight:800;color:var(--amber)}
/* Tablas de edición */
table.e{width:100%;border-collapse:collapse}
table.e th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:6px}
table.e td{padding:4px;border-top:1px solid var(--line);vertical-align:middle}
.scroll{overflow-x:auto}
.logo{width:34px;height:34px;object-fit:contain;border-radius:8px;background:#fff}
.ini{width:34px;height:34px;border-radius:50%;background:var(--soft);color:var(--red2);display:grid;place-items:center;font-size:11px;font-weight:900}
.toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-150%);background:#1d1d1f;color:#fff;padding:11px 16px;border-radius:12px;font-weight:800;z-index:99;transition:transform .25s;max-width:92vw}
.toast.on{transform:translate(-50%,0)}
.toast.err{background:var(--red2)}
.lay{display:grid;grid-template-columns:260px 1fr;min-height:calc(100svh - 60px)}
/* Pestaña activa fundida con el contenido (como en el sistema) */
.side{padding:16px 0 120px 12px!important}
.nav-i,.cat{position:relative;border-radius:12px 0 0 12px!important;width:100%!important}
.nav-i.on,.cat.on{background:var(--bg)!important;color:#9e0e1d!important;box-shadow:none!important}
.nav-i.on:before,.nav-i.on:after,.cat.on:before,.cat.on:after{content:'';position:absolute;right:0;width:18px;height:18px;pointer-events:none}
.nav-i.on:before,.cat.on:before{top:-18px;background:radial-gradient(circle at 0 0,transparent 17.5px,var(--bg) 18px)}
.nav-i.on:after,.cat.on:after{bottom:-18px;background:radial-gradient(circle at 0 100%,transparent 17.5px,var(--bg) 18px)}
.side-t{margin-right:12px}
.main{padding:22px 28px 120px!important}
.main .card{max-width:none!important}
.mlist{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(520px,1fr))}
.mlist .m{margin:0}
.meta .est{display:block;margin-top:6px;border:1.5px solid var(--line);border-radius:8px;padding:3px 4px;font-size:11px;font-weight:800;background:#fff;color:var(--ink2);max-width:100%}
.est-vivo{border-color:#dc2626!important;color:#dc2626!important;background:#fef2f2!important}
.est-susp,.est-post{border-color:#ea580c!important;color:#c2410c!important;background:#fff7ed!important}
.est-fin{border-color:#16a34a!important;color:#15803d!important;background:#f0fdf4!important}
.m{grid-template-columns:96px 1fr auto 1fr}
.up{display:flex;align-items:center;gap:8px;flex-wrap:wrap;text-transform:none;letter-spacing:0}
.up .btn{cursor:pointer}
.up-n{font-size:13px;font-weight:700;color:var(--muted);text-transform:none;letter-spacing:0}
.lg-up{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:12px;font-weight:800;color:var(--red2);white-space:nowrap}
.lg-up:hover .logo,.lg-up:hover .ini{outline:2px solid var(--red);outline-offset:2px}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 18px;box-shadow:0 10px 30px rgba(110,0,0,.05)}
.kpi small{display:block;font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.kpi b{display:block;font-size:34px;font-weight:900;color:var(--red);line-height:1.1;margin:4px 0}
.kpi span{font-size:12.5px;color:var(--ink2);font-weight:700}
.kpi.warn b{color:#c2410c}
.bar{height:8px;border-radius:99px;background:#f1e7e8;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#d7192b,#9e0e1d);border-radius:99px}
.two{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}
.two .card{margin-bottom:16px}
.rl{display:grid;grid-template-columns:56px 1fr;gap:2px 10px;width:100%;text-align:left;border:1px solid var(--line);border-radius:12px;background:#fff;padding:10px 12px;margin-bottom:6px;cursor:pointer;font:inherit}
.rl:hover{border-color:var(--red)}
.rl b{grid-row:span 2;font-size:15px;font-weight:900;align-self:center}
.rl span{font-size:11.5px;font-weight:800;color:var(--muted)}
.rl em{font-style:normal;font-weight:800;font-size:13.5px}
.chk{display:flex;align-items:center;gap:10px;padding:8px 0;font-weight:800;font-size:13.5px}
.chk b{min-width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--soft);color:var(--red2)}
.chk b.bad{background:#fff7ed;color:#c2410c}
.chk b.ok{background:#fef2f2;color:#dc2626}
.prog{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.pg{text-align:left;border:1px solid var(--line);border-radius:14px;background:#fff;padding:14px;cursor:pointer;font:inherit}
.pg:hover{border-color:var(--red)}
.pg b{display:block;font-weight:900}
.pg span{font-size:12.5px;font-weight:700;color:var(--muted)}
.hor{margin:14px 0;padding:16px;border-radius:14px;background:var(--soft);border:1.5px solid #f3cdd1}
.hor h3{margin:0 0 6px;font-size:15px;font-weight:900}
.chip.ck{padding:6px 12px;cursor:pointer;background:#fff;gap:8px;text-transform:none;letter-spacing:0}
.chip.ck input{accent-color:var(--red)}
@media (max-width:1100px){.mlist{grid-template-columns:1fr}}
.sub3{margin:18px 0 8px;font-size:14px;font-weight:900;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em}
.cuadro{margin:6px 0 18px;padding:14px;border-radius:16px;background:linear-gradient(180deg,#fff,#fdf2f3);border:1.5px solid var(--line)}
.cuadro h3{margin:0 0 10px;font-size:15px;font-weight:900;color:var(--red2)}
.cuadro.copa-de-oro{border-color:#f5d48a;background:linear-gradient(180deg,#fff,#fffaf0)}.cuadro.copa-de-oro h3{color:#a16207}
.cuadro.copa-de-plata{border-color:#cbd5e1;background:linear-gradient(180deg,#fff,#f6f8fb)}.cuadro.copa-de-plata h3{color:#475569}
.cuadro.copa-de-bronce{border-color:#e8bf9a;background:linear-gradient(180deg,#fff,#fdf6ef)}.cuadro.copa-de-bronce h3{color:#9a5b26}
.cq{display:flex;gap:28px;overflow-x:auto;align-items:stretch;padding-bottom:4px}
.cr{display:flex;flex-direction:column;min-width:220px}
.cr>small{font-size:10.5px;font-weight:900;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:6px}
.cm{display:flex;flex-direction:column;justify-content:space-around;flex:1;gap:12px}
.bx{position:relative;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:6px 10px;box-shadow:0 4px 12px rgba(110,0,0,.05)}
.cr:not(:last-child):not(.ter) .bx:after{content:'';position:absolute;right:-29px;top:50%;width:28px;border-top:2px solid #e8c9cd}
.bx small{display:block;font-size:10px;font-weight:800;color:var(--muted)}
.bt{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:700;padding:2px 0}
.bt.w{font-weight:900;color:#15803d}
.bt b{font-weight:900}
.cr.ter{border-left:1.5px dashed var(--line);padding-left:18px}
.lw{display:grid;gap:16px;grid-template-columns:260px 1fr;align-items:start}
.lt h2{margin-bottom:8px}
.lt-i{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:none;padding:8px 10px;border-radius:10px;font:inherit;font-weight:800;font-size:13px;cursor:pointer;text-align:left}
.lt-i:hover{background:var(--soft)}.lt-i.on{background:var(--red);color:#fff}
.lt-i b{min-width:26px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:11.5px;background:#f1e7e8;color:var(--ink2)}
.lt-i b.ok{background:#dcfce7;color:#15803d}.lt-i b.bad{background:#fff7ed;color:#c2410c}.lt-i.on b{background:#fff;color:var(--red2)}
tr.old td{background:#fff7ed}
.paste{margin-top:12px;border:1.5px dashed var(--line);border-radius:12px;padding:10px 12px}.paste summary{cursor:pointer;font-weight:800;color:var(--red2)}
textarea.i{font-family:inherit;resize:vertical}
.pl-r{display:grid;grid-template-columns:70px 1fr auto;grid-template-rows:auto auto;gap:2px 12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;margin-bottom:6px;background:#fff}
.pl-r b{grid-row:span 2;font-weight:900;font-size:14px}.pl-r span{font-size:11.5px;font-weight:800;color:var(--muted)}.pl-r em{font-style:normal;font-weight:800;grid-column:2}.pl-r .btn{grid-column:3;grid-row:1/3}
.codigo{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:14px;padding:14px 16px;border-radius:14px;background:#f0fdf4;border:1.5px solid #86efac}
.codigo small{display:block;font-size:11.5px;font-weight:800;color:#166534}.codigo b{display:block;font-size:30px;letter-spacing:.18em;font-weight:900;color:#14532d}.codigo span{font-size:12px;color:#166534;font-weight:700}
.camp{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin-bottom:12px}
.camp>div{padding:12px 14px;border-radius:14px;background:linear-gradient(135deg,#fffaf0,#fef3c7);border:1px solid #f5d48a}
.camp small{display:block;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:#a16207}.camp b{display:block;font-size:18px;font-weight:900}.camp span{font-size:12px;color:#713f12;font-weight:700}
.kpis.sm .kpi b{font-size:26px}
@media (max-width:860px){.lw{grid-template-columns:1fr}}
.side{background:linear-gradient(180deg,#d7192b,#9e0e1d);color:#fff;padding:16px 12px 120px;display:flex;flex-direction:column;gap:3px;position:sticky;top:56px;height:calc(100svh - 56px);overflow:auto}
.side-t{padding:10px 12px 14px;margin-bottom:6px;border-bottom:1px solid rgba(255,255,255,.18)}
.side-t small{display:block;font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.75}
.side-t b{display:block;font-size:15px;font-weight:900;line-height:1.25;margin:4px 0 8px}
.side-t span{display:inline-block;font-size:11px;font-weight:800;padding:3px 8px;border-radius:99px;background:rgba(255,255,255,.18)}
.side-t span.pub{background:#fff;color:#15803d}
.side-h{margin:14px 12px 4px;font-size:10.5px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;opacity:.7}
.nav-i,.cat{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:#fff;font:inherit;font-weight:800;font-size:13.5px;text-align:left;padding:10px 12px;border-radius:11px;cursor:pointer}
.nav-i svg{width:18px;height:18px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav-i:hover,.cat:hover{background:rgba(255,255,255,.12)}
.nav-i.on,.cat.on{background:#fff;color:#9e0e1d;box-shadow:0 6px 16px rgba(0,0,0,.15)}
.cats{display:flex;flex-direction:column;gap:3px}
.cat{flex-direction:column;align-items:flex-start;gap:1px}
.cat small{font-size:11px;font-weight:700;opacity:.75}
.side-n{margin:4px 12px;font-size:12px;opacity:.8}
.main{padding:20px 22px 120px;min-width:0}
.crumb{font-size:12.5px;font-weight:700;color:var(--muted);margin:0 0 12px}
.crumb b{color:var(--ink)}
.crumb i{font-style:normal;opacity:.5;margin:0 4px}
.top{position:sticky;top:0}
.steps{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin-top:14px}
.step{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1.5px solid var(--line);border-radius:14px}
.step>b{flex:0 0 32px;height:32px;border-radius:10px;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:900}
.step h3{margin:2px 0 4px;font-size:14.5px;font-weight:900}
.step p{margin:0 0 10px;font-size:12.5px;color:var(--muted)}
.sumi{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.sumi>div{padding:10px 12px;border-radius:12px;background:var(--soft)}
.sumi b{display:block;font-weight:900}
.sumi span{font-size:12.5px;color:var(--ink2)}
.sumi em{display:block;font-style:normal;font-size:11.5px;font-weight:800;color:var(--amber);margin-top:2px}
.warn{margin:10px 0 0;padding:8px 12px;border-radius:10px;background:#fffbeb;color:var(--amber);font-weight:800;font-size:12.5px}
.bad{color:var(--red);font-weight:900}
tr.camr td{font-size:12px;font-weight:800;color:#c2410c;background:#fff7ed;border-top:0}
.switch input[type=radio]{width:18px;height:18px;border-radius:50%}

<body>
<div class="gate" id="gate"><form onsubmit="return entrar(event)"><img src="/logo.webp" alt=""><h1>Panel de fixture</h1><p>Mundialito Alianza · acceso solo para la organización</p><input id="clave" type="password" placeholder="Clave" autocomplete="current-password" autofocus><button class="btn" type="submit">Ingresar</button><div class="err" id="gerr"></div></form></div>
<div id="app" class="hidden"></div>
<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/config.js?v=20261118b"></script>
<script>
const CFG=window.MUNDIALITO_CFG,sb=supabase.createClient(CFG.url,CFG.key);
let CLAVE='',TS=[],TID=null,FX={},CAT=null,VIEW='inicio',DIRTY=false,DAY='',ORIG={},IMP=null,HOR=null,LST={},LEQ=null,PLN=[],PLNC=null,PDIA='',PCAN='';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>p+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const slug=s=>String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const DAYS=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'],MON=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const fmtDay=d=>{if(!d)return 'Sin fecha';let x=new Date(d+'T00:00');return DAYS[x.getDay()]+' '+x.getDate()+' de '+MON[x.getMonth()]};
function toast(t,err){let e=$('#toast');e.textContent=t;e.className='toast on'+(err?' err':'');clearTimeout(e._t);e._t=setTimeout(()=>e.className='toast',2600)}
async function rpc(fn,args){let {data,error}=await sb.rpc(fn,{clave:CLAVE,...args});if(error){if(/clave/.test(error.message)){salir();toast('La clave cambió o es incorrecta',1)}throw error}return data}

// ── Ingreso ──
async function entrar(e){e&&e.preventDefault();let c=$('#clave').value.trim();if(!c)return false;$('#gerr').textContent='Verificando…';let {data,error}=await sb.rpc('panel_ok',{clave:c});if(error||!data){$('#gerr').textContent='Clave incorrecta';return false}CLAVE=c;try{sessionStorage.setItem('panel-clave',c)}catch(x){}$('#gate').classList.add('hidden');$('#app').classList.remove('hidden');await cargar();return false}
function salir(){CLAVE='';try{sessionStorage.removeItem('panel-clave')}catch(x){}$('#app').classList.add('hidden');$('#gate').classList.remove('hidden');$('#gerr').textContent=''}
window.addEventListener('beforeunload',e=>{if(DIRTY){e.preventDefault();e.returnValue=''}});

// ── Datos ──
async function cargar(tid){TS=await rpc('panel_torneos',{});TID=tid||TID||(TS.find(t=>t.publicado)||TS[0]||{}).id||null;await cargarFx();draw()}
async function cargarFx(){FX={};if(!TID)return;let rows=await rpc('panel_fixture',{tid:TID});rows.forEach(r=>FX[r.categoria]=r.datos);fotoHorarios();LST={};try{(await rpc('panel_listas_get',{tid:TID})).forEach(r=>{(LST[r.categoria]=LST[r.categoria]||{})[r.equipo]={jugadores:r.jugadores||[],cuerpo:r.cuerpo||[]}})}catch(e){}let t=tor();(t?.categorias||[]).forEach(c=>{if(!FX[c])FX[c]=nuevoFx()});if(!CAT||!FX[CAT])CAT=(t?.categorias||[])[0]||null;DIRTY=false;try{let r=await rpc('panel_arbitros_get',{tid:TID});ARB=r&&r[0]?{arbitros:r[0].arbitros||[],asignaciones:r[0].asignaciones||{}}:{arbitros:[],asignaciones:{}};ARBT=TID}catch(e){}}
const tor=()=>TS.find(t=>t.id===TID),fx=()=>FX[CAT];
const nuevoFx=()=>({format:'zonas',perZone:0,zones:[],teams:{},matches:[]});

// Foto de día/hora/cancha de cada partido tal como está publicado (para detectar cambios de horario)
function fotoHorarios(){ORIG={};Object.values(FX).forEach(f=>f.matches.forEach(m=>ORIG[m.id]={d:m.d||'',t:m.t||'',f:m.f||''}))}
function marcarCambios(){let at=new Date().toISOString(),n=0;Object.values(FX).forEach(f=>f.matches.forEach(m=>{let o=ORIG[m.id];if(!o||!(o.d||o.t))return;let now={d:m.d||'',t:m.t||'',f:m.f||''};if(o.d===now.d&&o.t===now.t&&o.f===now.f)return;
 let base=m.cam||o;if(base.d===now.d&&base.t===now.t&&base.f===now.f){delete m.cam;return}m.cam={d:base.d,t:base.t,f:base.f,at};n++}));return n}
// ── Motor: posiciones, ganador y llaves ──
const played=m=>m.hs!==null&&m.hs!==undefined&&m.hs!==''&&m.as!==null&&m.as!==undefined&&m.as!=='';
function winner(m){if(!played(m)||!m.h||!m.a)return null;let hs=+m.hs,as=+m.as;if(hs>as)return m.h;if(as>hs)return m.a;if(m.hp!=null&&m.ap!=null&&m.hp!==''&&m.ap!==''&&+m.hp!==+m.ap)return +m.hp>+m.ap?m.h:m.a;return null}
function standings(f,z){let R={};z.teams.forEach(id=>R[id]={id,pj:0,pts:0,gf:0,gc:0});

function statsCat(f){resolver(f);let pm=f.matches.filter(m=>played(m)&&m.h&&m.a),g=0,T={},max=null,pen=0;pm.forEach(m=>{let hs=+m.hs,as=+m.as;g+=hs+as;if(m.hp!=null&&m.hp!=='')pen++;[[m.h,hs,as],[m.a,as,hs]].forEach(([id,a,b])=>{let x=T[id]=T[id]||{id,pj:0,gf:0,gc:0,pg:0};x.pj++;x.gf+=a;x.gc+=b;if(a>b)x.pg++});let d=Math.abs(hs-as);if(!max||d>max.d||(d===max.d&&hs+as>max.t))max={m,d,t:hs+as}});
 let L=Object.values(T),gol=[...L].sort((a,b)=>b.gf-a.gf)[0],valla=[...L].filter(x=>x.pj).sort((a,b)=>a.gc/a.pj-b.gc/b.pj||b.pj-a.pj)[0];
 let finales=f.matches.filter(m=>/^final/i.test(m.ph||'')&&winner(m)).map(m=>({copa:copaDe(m.ph),w:tn(f,winner(m)),s:tn(f,winner(m)===m.h?m.a:m.h),r:m.hs+' - '+m.as+(m.hp!=null&&m.hp!==''?' ('+m.hp+'-'+m.ap+' pen.)':'')}));
 return {pj:pm.length,tot:f.matches.length,g,eq:Object.keys(f.teams).length,gol,valla,max,pen,finales}}
function vInforme(t){let cats=t.categorias||[],S=cats.map(c=>[c,statsCat(FX[c]||nuevoFx())]),pj=S.reduce((a,[,x])=>a+x.pj,0),tot=S.reduce((a,[,x])=>a+x.tot,0),g=S.reduce((a,[,x])=>a+x.g,0),eq=S.reduce((a,[,x])=>a+x.eq,0);
 const blk=([c,x])=>{let f=FX[c];return `<div class="card"><h2>${esc(c)} <small>${x.pj} de ${x.tot} partidos jugados</small></h2>${x.finales.length?`<div class="camp">${x.finales.map(z=>`<div><small>${esc(z.copa)}</small><b>${esc(z.w)}</b><span>Final: ${esc(z.w)} ${esc(z.r)} ${esc(z.s)}</span></div>`).join('')}</div>`:'<p class="note">Los campeones aparecen cuando se cargan los resultados de las finales.</p>'}
  <div class="kpis sm"><div class="kpi"><small>Goles</small><b>${x.g}</b><span>${x.pj?(x.g/x.pj).toFixed(1).replace('.',','):'0'} por partido</span></div><div class="kpi"><small>Equipos</small><b>${x.eq}</b></div><div class="kpi"><small>Más goleador</small><b style="font-size:17px">${x.gol?esc(tn(f,x.gol.id)):'—'}</b><span>${x.gol?x.gol.gf+' goles':''}</span></div><div class="kpi"><small>Valla menos vencida</small><b style="font-size:17px">${x.valla?esc(tn(f,x.valla.id)):'—'}</b><span>${x.valla?x.valla.gc+' goles en contra':''}</span></div><div class="kpi"><small>Mayor goleada</small><b style="font-size:17px">${x.max?esc(tn(f,x.max.m.h))+' '+x.max.m.hs+' - '+x.max.m.as+' '+esc(tn(f,x.max.m.a)):'—'}</b></div><div class="kpi"><small>Definidos por penales</small><b>${x.pen}</b></div></div></div>`};
 return `<div class="row" style="justify-content:space-between;margin-bottom:12px"><p class="note" style="margin:0">El informe se arma solo con los resultados cargados. Al terminar el torneo, imprimilo o guardalo en PDF.</p><button class="btn s" onclick="imprimirInforme()">Imprimir / guardar PDF</button></div>

 let pags=placasDatos();
 return `<div class="card"><h2>Placas para historias <small>formato 9:16 · 1080 × 1920</small></h2><p class="note" style="margin-top:0">Al terminar cada turno, elegí el día y el turno y descargá la placa con todos los resultados para subirla a las historias. Si son muchos partidos se arma en varias placas.</p>
 <div class="grid" style="margin-top:12px"><label class="f">Día<select class="i" onchange="PLQ.dia=this.value;draw()">${days.map(d=>`<option value="${d}" ${d===PLQ.dia?'selected':''}>${fmtDay(d)}</option>`).join('')}</select></label><label class="f">Turno<select class="i" onchange="PLQ.turno=this.value;draw()">${[['manana','Mañana (hasta las 14)'],['tarde','Tarde (desde las 14)'],['todo','Todo el día']].map(([v,l])=>`<option value="${v}" ${PLQ.turno===v?'selected':''}>${l}</option>`).join('')}</select></label><label class="f">Categoría<select class="i" onchange="PLQ.cat=this.value;draw()"><option value="">Todas</option>${(t.categorias||[]).map(c=>`<option ${c===PLQ.cat?'selected':''}>${esc(c)}</option>`).join('')}</select></label><label class="f">Qué muestra<select class="i" onchange="PLQ.tipo=this.value;draw()"><option value="res" ${PLQ.tipo==='res'?'selected':''}>Resultados</option><option value="prog" ${PLQ.tipo==='prog'?'selected':''}>Partidos del turno (horarios)</option></select></label></div>
 ${pags.length?`<div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn s" onclick="bajarPlacas()">Descargar ${pags.length>1?'las '+pags.length+' placas':'la placa'}</button></div>`:''}</div>
 ${pags.length?`<div class="pqs">${pags.map((L,k)=>`<div class="pq-w"><div class="pq-sc">${placaHTML(L,k,pags.length)}</div><button class="btn l s" onclick="bajarPlaca(${k})">Descargar</button></div>`).join('')}</div>`:`<div class="card"><div class="empty">${PLQ.tipo==='res'?'Todavía no hay resultados cargados en ese turno.':'No hay partidos en ese turno.'}</div></div>`}`}
async function bajarPlaca(k){try{await h2i()}catch(e){return toast('No se pudo cargar el generador de imágenes. Revisá la conexión.',1)}let el=document.getElementById('placa'+k);toast('Armando la imagen…');try{let fe='';try{fe=await fontCSS()}catch(x){}let url=await htmlToImage.toPng(el,{width:1080,height:1920,pixelRatio:1,cacheBust:true,fontEmbedCSS:fe||undefined,style:{transform:'none',margin:'0'}});let a=document.createElement('a');a.href=url;a.download=`resultados-${PLQ.dia}-${PLQ.turno}${PLQ.cat?'-'+slug(PLQ.cat):''}${document.querySelectorAll('.placa').length>1?'-'+(k+1):''}.png`;a.click();toast('Placa descargada')}catch(e){console.error(e);toast('No se pudo armar la imagen',1)}}
async function bajarPlacas(){let n=document.querySelectorAll('.placa').length;for(let k=0;k<n;k++){await bajarPlaca(k);await new Promise(r=>setTimeout(r,400))}}

// ── Galería de fotos del torneo ──
async function achicarJpg(file,max=1600){let img=await createImageBitmap(file),k=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return await new Promise(r=>c.toBlob(r,'image/jpeg',.85))}
function vGaleria(t){let G=t.galeria=Array.isArray(t.galeria)?t.galeria:[];
 return `<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Galería de fotos <small>${G.length} fotos</small></h2><label class="btn s" style="cursor:pointer">Subir fotos<input type="file" accept="image/jpeg,image/png,image/webp" multiple hidden onchange="subirFotos(this)"></label></div><p class="note">Se ven en la página del torneo, en la pestaña «Fotos». Podés elegir varias a la vez: se achican solas para que carguen rápido. Escribí un epígrafe corto si querés (lugar, partido o categoría). Tocá «Guardar cambios» para publicarlas.</p>
 ${G.length?`<div class="gal">${G.map((g,k)=>`<div class="gal-i"><img src="${esc(g.u)}" alt="" loading="lazy"><input class="i" value="${esc(g.c||'')}" placeholder="Epígrafe (opcional)" onchange="tor().galeria[${k}].c=this.value;marcar()"><div class="row" style="justify-content:space-between"><span><button class="btn x s" title="Mover antes" onclick="movFoto(${k},-1)" ${k?'':'disabled'}>‹</button><button class="btn x s" title="Mover después" onclick="movFoto(${k},1)" ${k<G.length-1?'':'disabled'}>›</button></span><button class="btn x s" onclick="if(confirm('¿Quitar esta foto de la galería?')){tor().galeria.splice(${k},1);marcar();draw()}">Quitar</button></div></div>`).join('')}</div>`:'<div class="empty" style="margin-top:12px">Todavía no hay fotos.</div>'}</div>`}
function movFoto(k,d){let G=tor().galeria,x=G.splice(k,1)[0];G.splice(k+d,0,x);marcar();draw()}
async function subirFotos(inp){let fs=[...inp.files];if(!fs.length)return;let t=tor(),ok=0;t.galeria=Array.isArray(t.galeria)?t.galeria:[];for(let i=0;i<fs.length;i++){toast(`Subiendo ${i+1} de ${fs.length}…`);try{let b=await achicarJpg(fs[i]);b.name=fs[i].name;let url=await subir(b,'fotos','image/jpeg');t.galeria.push({u:url,c:''});ok++;marcar();draw()}catch(e){toast('No se pudo subir '+fs[i].name+': '+e.message,1);await new Promise(r=>setTimeout(r,1500))}}toast(ok+' foto'+(ok===1?'':'s')+' cargada'+(ok===1?'':'s')+'. Tocá «Guardar cambios» para publicarlas.')}

// ── Canchas y sedes ──
const mapaQ=s=>[s.nom,s.dir,s.ciudad].filter(Boolean).join(', ');
function vSedes(t){let S=conf().sedes=Array.isArray(conf().sedes)?conf().sedes:[];let enFx=[...new Set(Object.values(FX).flatMap(f=>f.matches.map(m=>m.f).filter(Boolean)))].sort(),asig=new Set(S.flatMap(s=>String(s.canchas||'').split(',').map(x=>x.trim()).filter(Boolean))),sin=enFx.filter(c=>!asig.has(c));
 return `<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Canchas y sedes <small>${S.length}</small></h2><button class="btn s" onclick="conf().sedes.push({id:uid('S'),nom:'',dir:'',ciudad:'',canchas:'',nota:''});marcar();draw()">+ Agregar sede</button></div><p class="note">Se publican en la página del torneo como «Cómo llegar», con el mapa de cada sede y qué canchas tiene. Escribí la dirección como la buscarías en Google Maps.</p>${sin.length?`<p class="warn">Canchas del fixture que todavía no están en ninguna sede: ${sin.map(esc).join(', ')}</p>`:''}</div>
 ${S.map((s,k)=>`<div class="card sede"><div class="grid"><label class="f">Nombre de la sede<input class="i" value="${esc(s.nom)}" placeholder="Club Atlético Alianza" onchange="conf().sedes[${k}].nom=this.value;marcar();draw()"></label><label class="f">Dirección<input class="i" value="${esc(s.dir)}" placeholder="Calle y número" onchange="conf().sedes[${k}].dir=this.value;marcar();draw()"></label><label class="f">Ciudad<input class="i" value="${esc(s.ciudad)}" placeholder="Arteaga, Santa Fe" onchange="conf().sedes[${k}].ciudad=this.value;marcar();draw()"></label><label class="f">Canchas (separadas por coma)<input class="i" value="${esc(s.canchas)}" placeholder="Cancha 1, Cancha 2" onchange="conf().sedes[${k}].canchas=this.value;marcar();draw()"></label></div>
  <label class="f" style="margin-top:10px">Indicaciones (opcional)<input class="i" value="${esc(s.nota||'')}" placeholder="Ej.: entrada por calle San Martín, estacionamiento al costado" onchange="conf().sedes[${k}].nota=this.value;marcar()"></label>
  ${mapaQ(s)?`<iframe class="mapa" src="https://www.google.com/maps?q=${encodeURIComponent(mapaQ(s))}&output=embed" loading="lazy" title="Mapa"></iframe>`:''}<div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn x s" onclick="if(confirm('¿Quitar esta sede?')){conf().sedes.splice(${k},1);marcar();draw()}">Quitar sede</button></div></div>`).join('')||'<div class="card"><div class="empty">Todavía no hay sedes cargadas.</div></div>'}`}

// ── Inscripciones online ──
let INS=[],INST=null,INSF='pendiente';
async function cargarIns(){INST=TID;try{INS=await rpc('panel_inscripciones',{tid:TID})}catch(e){INS=[]}draw()}
function vInscripciones(t){if(INST!==TID){INST=TID;INS=[];setTimeout(cargarIns,0)}let C=conf(),url=location.origin+'/inscripcion/?t='+encodeURIComponent(t.id),cats=t.categorias||[];C.inscCats=Array.isArray(C.inscCats)?C.inscCats:[];
 let n={pendiente:0,aprobada:0,rechazada:0};INS.forEach(i=>n[i.estado]=(n[i.estado]||0)+1);let L=INS.filter(i=>!INSF||i.estado===INSF);
 return `<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Inscripciones online</h2><label class="switch"><input type="checkbox" ${C.inscripciones?'checked':''} onchange="conf().inscripciones=this.checked;guardarSoloTorneo(this.checked?'Inscripciones abiertas: el formulario ya funciona':'Inscripciones cerradas');draw()">${C.inscripciones?'Abiertas':'Cerradas'}</label></div>
 <p class="note">Con las inscripciones abiertas, la página del torneo muestra el botón «Inscribí a tu club» y cualquiera puede mandar el formulario. Los datos (teléfonos y correos) solo se ven acá. Al aprobar una inscripción, el club se agrega a las categorías que eligió.</p>${linkBox(url,`<button class="btn l s" onclick="copiar('Inscribí a tu club en el ${esc(t.nombre).replace(/'/g,'')}: ${esc(url)}','Mensaje copiado')">Copiar mensaje</button>`)}
 <div class="grid" style="margin-top:12px"><div class="f">Categorías que se ofrecen<div class="chips"><label class="chip ck"><input type="checkbox" ${!C.inscCats.length?'checked':''} onchange="conf().inscCats=[];marcar();draw()">Todas las del torneo</label>${cats.map(c=>`<label class="chip ck"><input type="checkbox" ${C.inscCats.includes(c)?'checked':''} onchange="conf().inscCats=this.checked?[...conf().inscCats,'${esc(c)}']:conf().inscCats.filter(x=>x!=='${esc(c)}');marcar();draw()">${esc(c)}</label>`).join('')}</div></div><label class="f">Cierre de inscripción (opcional)<input class="i" type="date" value="${esc(C.inscCierre||'')}" onchange="conf().inscCierre=this.value;marcar()"></label><label class="f">Cupos por categoría (opcional)<input class="i" type="number" min="0" value="${esc(C.inscCupo||'')}" onchange="conf().inscCupo=+this.value||null;marcar()"></label></div></div>
 <div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Recibidas <small>${INS.length}</small></h2><div class="tabs sub" style="margin:0">${[['pendiente','Pendientes'],['aprobada','Aprobadas'],['rechazada','Rechazadas'],['','Todas']].map(([v,l])=>`<button class="${INSF===v?'on':''}" onclick="INSF='${v}';draw()">${l} ${v?n[v]:INS.length}</button>`).join('')}</div></div>
 ${L.map(i=>{let d=i.datos||{};return `<div class="ins ${i.estado}"><div class="ins-h"><div><b>${esc(d.club||'')}</b><span>${esc([d.ciudad,d.provincia].filter(Boolean).join(', '))}</span></div><em class="est-${i.estado}">${({pendiente:'Pendiente',aprobada:'Aprobada',rechazada:'Rechazada'})[i.estado]}</em></div>
  <div class="chips" style="margin:8px 0">${(d.categorias||[]).map(c=>`<span class="chip" style="padding:5px 12px">${esc(c)}</span>`).join('')}</div>
  <div class="ins-d"><span><small>Delegado</small>${esc(d.delegado||'')}</span><span><small>Teléfono</small>${d.telefono?`<a href="https://wa.me/${telWa(d.telefono)}" target="_blank" rel="noopener">${esc(d.telefono)}</a>`:''}</span><span><small>Correo</small>${esc(d.email||'')}</span><span><small>Jugadores aprox.</small>${esc(d.jugadores||'')}</span><span><small>Recibida</small>${new Date(i.creado).toLocaleString('es-AR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</span></div>
  ${d.comentario?`<p class="note" style="color:var(--ink2)">«${esc(d.comentario)}»</p>`:''}<div class="row" style="justify-content:flex-end;margin-top:8px">${i.estado!=='aprobada'?`<button class="btn g s" onclick="insEstado('${i.id}','aprobada')">Aprobar y sumar el club</button>`:''}${i.estado!=='rechazada'?`<button class="btn l s" onclick="insEstado('${i.id}','rechazada')">Rechazar</button>`:''}${i.estado!=='pendiente'?`<button class="btn x s" onclick="insEstado('${i.id}','pendiente')">Volver a pendiente</button>`:''}</div></div>`}).join('')||'<div class="empty">No hay inscripciones en esta lista.</div>'}</div>`}
async function insEstado(id,e){let i=INS.find(x=>x.id===id);try{await rpc('panel_inscripcion_estado',{iid:id,estado:e});i.estado=e;if(e==='aprobada'){let d=i.datos||{},sum=[];(d.categorias||[]).forEach(c=>{if(!FX[c])return;let f=FX[c];if(Object.values(f.teams).some(x=>nrm(x.n)===nrm(d.club)))return;f.teams[uid('T')]={n:d.club,c:[d.ciudad,d.provincia].filter(Boolean).join(', '),k:[],l:''};sum.push(c)});if(sum.length){marcar();toast(d.club+' se sumó a '+sum.join(', ')+'. Asignale zona y tocá «Guardar cambios».')}else toast('Inscripción aprobada')}else toast(e==='rechazada'?'Inscripción rechazada':'Volvió a pendientes');draw()}catch(x){toast('No se pudo cambiar: '+x.message,1)}}

// ── Encuesta a las delegaciones ──
const PREG=[['org','Organización general'],['fix','Fixture y horarios'],['can','Estado de las canchas'],['arb','Arbitraje'],['alo','Alojamiento'],['com','Comidas'],['ate','Atención de la organización']];
let ENC=[],ENCT=null;
async function cargarEnc(){ENCT=TID;try{ENC=await rpc('panel_encuesta',{tid:TID})}catch(e){ENC=[]}draw()}
function vEncuesta(t){if(ENCT!==TID){ENCT=TID;ENC=[];setTimeout(cargarEnc,0)}let C=conf(),url=location.origin+'/encuesta/?t='+encodeURIComponent(t.id);
 let prom=PREG.map(([k,l])=>{let v=ENC.map(r=>+((r.respuestas||{})[k])).filter(x=>x>=1&&x<=5);return {k,l,n:v.length,p:v.length?v.reduce((a,b)=>a+b,0)/v.length:0}}),vol={si:0,talvez:0,no:0};ENC.forEach(r=>{let v=(r.respuestas||{}).volver;if(vol[v]!==undefined)vol[v]++});let gen=prom.filter(x=>x.n),pg=gen.length?gen.reduce((a,x)=>a+x.p,0)/gen.length:0;
 let msg=`¡Gracias por venir al ${t.nombre}! Nos ayudás mucho si nos contás cómo te fue (son 2 minutos): ${url}`;
 return `<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Encuesta a las delegaciones</h2><label class="switch"><input type="checkbox" ${C.encuesta?'checked':''} onchange="conf().encuesta=this.checked;guardarSoloTorneo(this.checked?'Encuesta abierta: ya se puede responder':'Encuesta cerrada');draw()">${C.encuesta?'Abierta':'Cerrada'}</label></div><p class="note">Al terminar el torneo, abrí la encuesta y mandá el link al grupo de delegados. Cada uno puntúa del 1 al 5 la organización, las canchas, el arbitraje, el alojamiento y las comidas, y deja sus comentarios. Las respuestas solo se ven acá.</p>${linkBox(url,`<button class="btn l s" onclick="copiar(${esc(JSON.stringify(msg))},'Mensaje copiado')">Copiar mensaje para WhatsApp</button>`)}</div>
 <div class="kpis"><div class="kpi"><small>Respuestas</small><b>${ENC.length}</b><span>${(n=>n+(n===1?' club':' clubes'))(new Set(ENC.map(r=>nrm(r.club)).filter(Boolean)).size)}</span></div><div class="kpi"><small>Promedio general</small><b>${pg?pg.toFixed(1).replace('.',','):'—'}</b><span>sobre 5</span></div><div class="kpi"><small>Volverían</small><b>${ENC.length?Math.round(vol.si/ENC.length*100)+'%':'—'}</b><span>${vol.talvez} tal vez · ${vol.no} no</span></div></div>
 <div class="two"><div class="card"><h2>Puntaje por tema</h2>${prom.map(x=>`<div class="enc-r"><span>${esc(x.l)}</span><div class="bar"><i style="width:${x.p/5*100}%"></i></div><b>${x.n?x.p.toFixed(1).replace('.',','):'—'}</b></div>`).join('')}</div>
 <div class="card"><h2>Comentarios <small>${ENC.filter(r=>r.comentario).length}</small></h2>${ENC.filter(r=>r.comentario).map(r=>`<div class="enc-c"><p>«${esc(r.comentario)}»</p><small>${esc(r.club||'Sin club')}${r.rol?' · '+esc(r.rol):''} · ${new Date(r.creado).toLocaleDateString('es-AR')}</small></div>`).join('')||'<div class="empty">Todavía no hay comentarios.</div>'}</div></div>`}
