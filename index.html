<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#c3121f">
<title>Mundialito Alianza</title>
<meta name="description" content="Fixture, resultados y tablas de posiciones del Mundialito en vivo.">
<link rel="icon" href="/logo.webp">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--red:#d7192b;--red2:#9e0e1d;--red3:#6f0a16;--ink:#2b2230;--mut:#7a6f7e;--bg:#eceef4;--card:#fff;--line:#ece7ef;--fill:#f5f3f7;--win:#10b981;--lose:#ef4444;--indigo:#4f46e5;--sky:#0ea5e9;--green:#10b981;--amber:#f59e0b;--violet:#8b5cf6;--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;padding:0}
a{color:inherit;text-decoration:none}
img{display:block}
/* Barra superior */
.top{position:sticky;top:0;z-index:30;padding:var(--safe-t) 14px 0;height:calc(62px + var(--safe-t));display:flex;align-items:center;gap:10px;color:#fff;background:linear-gradient(120deg,var(--red) 0%,#c3121f 55%,var(--red2) 100%);box-shadow:0 4px 18px rgba(158,14,29,.3)}
.top .logo{display:flex;align-items:center;gap:9px;flex:1;min-width:0}
.top .logo img{width:30px;height:36px;object-fit:contain;filter:brightness(0) invert(1);flex-shrink:0}
.top .logo b{font-weight:900;font-size:18px;letter-spacing:.06em;text-transform:uppercase;line-height:1}
.top .logo small{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600;opacity:.88;margin-top:3px;white-space:nowrap}
.top .soc{display:flex;gap:6px}
.top .soc a{width:36px;height:36px;border-radius:11px;background:rgba(255,255,255,.15);display:grid;place-items:center;transition:background .2s}
.top .soc a:active{background:rgba(255,255,255,.3)}
.top .soc svg{width:19px;height:19px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dot{width:7px;height:7px;border-radius:50%;background:#6ee7b7;box-shadow:0 0 0 0 rgba(110,231,183,.7);animation:pulse 2s infinite}
.dot.off{background:#fecaca;animation:none}
@keyframes pulse{70%{box-shadow:0 0 0 7px rgba(110,231,183,0)}100%{box-shadow:0 0 0 0 rgba(110,231,183,0)}}
.wrap{max-width:760px;margin:0 auto}
main{padding:14px 14px 10px}
/* Portada */
.hero{position:relative;margin:-14px -14px 0;padding:34px 20px 74px;color:#fff;overflow:hidden;background:var(--red3)}
.hero:before{content:'';position:absolute;inset:0;background:url(/img/aerea.jpg) center/cover;opacity:.55}
.hero:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(111,10,22,.35) 0%,rgba(158,14,29,.75) 55%,rgba(111,10,22,.98) 100%)}
.hero>*{position:relative;z-index:1}
.hero .lg{width:58px;height:70px;object-fit:contain;filter:brightness(0) invert(1) drop-shadow(0 4px 14px rgba(0,0,0,.35));margin-bottom:12px}
.hero h1{margin:0;font-size:34px;font-weight:900;letter-spacing:-.01em;line-height:1.02;text-transform:uppercase}
.hero p{margin:10px 0 0;font-size:15px;line-height:1.45;opacity:.92;max-width:460px}
.hero .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.hero .chips span{background:rgba(255,255,255,.16);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.22);border-radius:99px;padding:6px 12px;font-size:12.5px;font-weight:700}
.lift{margin-top:-52px;position:relative;z-index:2}
.lift:empty{display:none}
.hero.nolive{padding-bottom:30px}
.h2{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 10px}
.h2 h2{margin:0;font-size:17px;font-weight:800;display:flex;align-items:center;gap:8px}
.h2 h2 i{width:8px;height:20px;border-radius:3px;background:var(--red)}
.h2 small{color:var(--mut);font-size:12.5px;font-weight:600}
.live-card{display:block;position:relative;border-radius:22px;overflow:hidden;color:#fff;min-height:170px;margin-bottom:12px;box-shadow:0 10px 30px rgba(111,10,22,.3);background:var(--red3)}
.live-card .bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.6}
.live-card:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 10%,rgba(80,6,16,.92) 100%)}
.live-card>div{position:relative;z-index:1;padding:16px 16px 18px;display:flex;flex-direction:column;justify-content:flex-end;min-height:170px}
.badge-live{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;background:#fff;color:var(--red);font-size:11.5px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;padding:5px 10px;border-radius:99px;margin-bottom:auto}
.badge-live i{width:7px;height:7px;border-radius:50%;background:var(--red);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
.live-card b{font-size:21px;font-weight:900;line-height:1.15;margin-top:30px}
.live-card small{opacity:.9;font-size:13px;margin-top:4px}
.live-card .go{margin-top:12px;align-self:flex-start;background:var(--red);color:#fff;font-weight:800;font-size:13.5px;padding:10px 16px;border-radius:12px;box-shadow:0 6px 16px rgba(215,25,43,.45)}
.up-row{display:flex;gap:12px;overflow-x:auto;padding:2px 14px 6px;margin:0 -14px;scroll-snap-type:x mandatory;scrollbar-width:none}
.up-row::-webkit-scrollbar{display:none}
.up{flex:0 0 78%;max-width:300px;scroll-snap-align:start;background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 4px 16px rgba(60,20,40,.08);display:flex;flex-direction:column}
.up .ph{height:96px;background-size:cover;background-position:center;position:relative}
.up .ph:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.35))}
.up .cd{position:absolute;left:12px;bottom:-18px;z-index:1;background:#fff;border-radius:14px;padding:6px 10px;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.15);min-width:58px}
.up .cd b{display:block;font-size:20px;font-weight:900;color:var(--red);line-height:1}
.up .cd small{font-size:10.5px;font-weight:700;color:var(--mut);text-transform:uppercase}
.up .bd{padding:26px 14px 14px;flex:1;display:flex;flex-direction:column}
.up .bd b{font-size:15.5px;font-weight:800;line-height:1.2}
.up .bd small{color:var(--mut);font-size:12.5px;margin-top:4px}
.up .bd .act{margin-top:auto;padding-top:12px}
.btn{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:13px;padding:9px 13px;border-radius:11px;background:var(--red);color:#fff}
.btn.ghost{background:var(--fill);color:var(--mut)}
.pill{display:inline-block;font-size:11px;font-weight:800;padding:3px 9px;border-radius:99px;text-transform:uppercase;letter-spacing:.03em}
.pill.ma{background:#fde3e6;color:var(--red2)}.pill.pre{background:#e0e7ff;color:#4338ca}.pill.esp{background:#ede9fe;color:#6d28d9}
.cal{background:#fff;border-radius:20px;box-shadow:0 4px 16px rgba(60,20,40,.06);overflow:hidden}
.cal-m{padding:12px 16px 6px;font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--red);background:linear-gradient(90deg,#fff1f2,#fff)}
.cal-i{display:flex;gap:12px;align-items:center;padding:11px 16px;border-top:1px solid var(--line)}
.cal-d{width:48px;flex-shrink:0;text-align:center;border-radius:12px;padding:6px 0;background:var(--fill)}
.cal-d b{display:block;font-size:19px;font-weight:900;line-height:1}
.cal-d small{font-size:10.5px;font-weight:700;color:var(--mut);text-transform:uppercase}
.cal-i>div:nth-child(2){flex:1;min-width:0}
.cal-i b.n{display:block;font-size:14.5px;font-weight:700;line-height:1.25}
.cal-i small.s{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.cal-i .r{flex-shrink:0;color:#c4bcc8;font-size:20px}
.past{background:#fff;border-radius:20px;box-shadow:0 4px 16px rgba(60,20,40,.06);overflow:hidden}
.past-i{padding:12px 16px;border-top:1px solid var(--line)}
.past-i:first-child{border-top:0}
.past-i b{font-size:14px;font-weight:700}
.past-i small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.champs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.champs span{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;background:#fef3c7;color:#92400e;border-radius:99px;padding:4px 9px}
.ig{background:#fff;border-radius:20px;box-shadow:0 4px 16px rgba(60,20,40,.06);padding:14px}
.ig-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.ig-h .av{width:44px;height:44px;border-radius:50%;padding:2px;background:linear-gradient(45deg,#f59e0b,#ef4444,#8b5cf6)}
.ig-h .av span{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:var(--red);border:2px solid #fff}
.ig-h .av img{width:20px;height:24px;object-fit:contain;filter:brightness(0) invert(1)}
.ig-h div{flex:1;min-width:0}
.ig-h b{display:block;font-size:14.5px}
.ig-h small{color:var(--mut);font-size:12px}
.ig-g{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;border-radius:12px;overflow:hidden}
.ig-g a{aspect-ratio:1;background-size:cover;background-position:center;position:relative}
.ig-g a:after{content:'';position:absolute;inset:0;background:rgba(0,0,0,0);transition:.2s}
.ig-g a:active:after{background:rgba(0,0,0,.2)}
.mascots{display:flex;justify-content:center;gap:4px;margin:26px 0 0}
.mascots img{height:74px;width:auto}
/* Torneo */
.thead{position:relative;margin:-14px -14px 0;padding:14px 16px 18px;color:#fff;background:linear-gradient(135deg,var(--red2),var(--red3));overflow:hidden}
.thead:before{content:'';position:absolute;inset:0;background-size:cover;background-position:center;opacity:.28;background-image:var(--img)}
.thead>*{position:relative}
.thead .bk{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;opacity:.9;margin-bottom:10px}
.thead h1{margin:0;font-size:22px;font-weight:900;line-height:1.15}
.thead p{margin:6px 0 0;font-size:13px;opacity:.9}
.cats{display:flex;gap:7px;overflow-x:auto;padding:12px 14px 2px;margin:0 -14px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats a{flex-shrink:0;padding:8px 15px;border-radius:99px;background:#fff;font-weight:700;font-size:13.5px;color:#5d5262;box-shadow:0 1px 4px rgba(60,20,40,.07)}
.cats a.on{background:var(--ink);color:#fff}
.stabs{position:sticky;top:calc(62px + var(--safe-t));z-index:20;margin:12px -14px 14px;background:rgba(236,238,244,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:6px 14px}
.stabs nav{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:#fff;border-radius:16px;padding:4px;box-shadow:0 2px 10px rgba(60,20,40,.07)}
.stabs a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 6px;border-radius:12px;font-size:11.5px;font-weight:700;color:#8a7f8e}
.stabs a svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.stabs a.on{background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;box-shadow:0 6px 14px rgba(215,25,43,.3)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:#dfe1e9;border-radius:13px;padding:4px;margin-bottom:12px}
.seg.three{grid-template-columns:repeat(3,1fr)}
.seg button{padding:9px 0;font-size:13px;font-weight:700;color:#7a6f7e;border-radius:10px}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.daynav{display:flex;align-items:stretch;height:48px;margin-bottom:12px;border-radius:14px;overflow:hidden;background:linear-gradient(120deg,var(--red),var(--red2));color:#fff;box-shadow:0 6px 16px rgba(215,25,43,.25)}
.daynav button{width:48px;display:grid;place-items:center;background:rgba(0,0,0,.12)}
.daynav button:disabled{opacity:.35}
.daynav button svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.daynav .mid{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.daynav .mid b{font-size:15px;font-weight:800}
.daynav .mid b:first-letter{text-transform:uppercase}
.daynav .mid small{font-size:11px;opacity:.85;font-weight:600}
.daynav .mid select{position:absolute;inset:0;opacity:0;width:100%;font-size:16px}
.search{position:relative;margin-bottom:14px}
.search input{width:100%;padding:12px 40px 12px 14px;border:0;border-radius:13px;background:#fff;font-size:16px;box-shadow:0 1px 4px rgba(60,20,40,.07)}
.search svg{position:absolute;right:13px;top:50%;width:18px;height:18px;margin-top:-9px;fill:none;stroke:#9a8fa0;stroke-width:2}
.box{background:#fff;border-radius:18px;box-shadow:0 2px 10px rgba(60,20,40,.06);overflow:hidden;margin-bottom:12px}
.box-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;font-size:13px;font-weight:800;border-bottom:1px solid var(--line)}
.box-h small{font-weight:600;color:var(--mut);font-size:12px}
.box-h .zt{display:flex;align-items:center;gap:8px}
.box-h .zt i{width:6px;height:18px;border-radius:3px;background:var(--zc,var(--red))}
.mt{display:grid;grid-template-columns:1fr 32px 74px 32px 1fr;align-items:center;column-gap:6px;padding:12px 10px 10px;border-top:1px solid var(--line)}
.mt:first-of-type{border-top:0}
.mt .tn{font-size:12.5px;font-weight:700;line-height:1.2;word-break:normal;overflow-wrap:break-word;hyphens:auto;-webkit-hyphens:auto}
.mt .tn.l{text-align:right}
.mt .tn.tbd{color:#a59cab;font-weight:600;font-style:italic}
.mt .tn.w{color:#047857}
.mt .sc{text-align:center;font-weight:900;font-size:19px;font-variant-numeric:tabular-nums;white-space:nowrap}
.mt .sc i{font-style:normal;display:inline-block;min-width:14px;padding-bottom:1px;border-bottom:3px solid transparent}
.mt .sc i.w{border-bottom-color:var(--win)}
.mt .sc .vs{display:inline-block;font-size:13px;font-weight:800;color:var(--red);background:#fff1f2;border-radius:9px;padding:5px 8px}
.mt .sc.flash{animation:flash 1.8s ease}
@keyframes flash{0%,35%{color:var(--win);transform:scale(1.18)}100%{}}
.mt .pens{grid-column:3;text-align:center;font-size:11.5px;font-weight:700;color:var(--mut)}
.mt .ft{grid-column:1/-1;display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:7px;font-size:11.5px;font-weight:600;color:var(--mut)}
.mt .ft span{background:var(--fill);border-radius:7px;padding:2px 8px}
.mt .ft span.st{background:#ecfdf5;color:#047857}
.cr{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:900;color:#fff;background:var(--c1);box-shadow:inset 0 0 0 3px var(--c2),0 1px 3px rgba(0,0,0,.2);text-shadow:0 1px 2px rgba(0,0,0,.45);flex-shrink:0}
.cr.big{width:66px;height:66px;font-size:21px;box-shadow:inset 0 0 0 5px var(--c2),0 3px 8px rgba(0,0,0,.2)}
.cr.ghost{background:#dcd6e0;box-shadow:none;text-shadow:none}
.cr.lg{background:none!important;box-shadow:none!important;border-radius:0}
.cr.lg{display:flex;align-items:center;justify-content:center;overflow:visible}
.cr.lg img{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.18))}
.free{color:var(--mut);font-size:12.5px;padding:10px 14px;border-top:1px dashed var(--line)}
.free b{color:var(--ink)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:11px;font-weight:800;text-transform:uppercase;padding:9px 3px 7px;text-align:center;color:var(--mut)}
th.g{box-shadow:inset 0 -3px var(--win)}th.p{box-shadow:inset 0 -3px var(--lose)}
th.tn,td.tn{text-align:left}
td{padding:9px 3px;text-align:center;border-top:1px solid var(--line);font-size:13.5px;font-weight:600}
td.pos{width:30px;font-weight:900;color:var(--mut)}
tr.q1 td.pos{box-shadow:inset 4px 0 var(--green);color:var(--green)}tr.q2 td.pos{box-shadow:inset 4px 0 var(--amber);color:#b45309}
td.tn{max-width:0;width:100%}
td.tn div{display:flex;align-items:center;gap:8px;min-width:0}
td.tn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-weight:700}
td.tn .cr{width:26px;height:26px;font-size:9.5px;box-shadow:inset 0 0 0 2px var(--c2)}
td.pts{font-weight:900;color:var(--ink)}
td.zn{font-size:11px;color:var(--mut);font-weight:700}
.wide{display:none}
.refs{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin:0 4px 14px}
.refs span{display:flex;align-items:center;gap:6px}
.refs i{width:4px;height:14px;border-radius:2px}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tm{background:#fff;border-radius:16px;padding:12px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;box-shadow:0 2px 10px rgba(60,20,40,.06)}
.tm b{font-size:13px;font-weight:800;line-height:1.2}
.tm small{color:var(--mut);font-size:11.5px}
.tm .z{font-size:10.5px;font-weight:800;color:var(--red);background:#fff1f2;border-radius:99px;padding:2px 8px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi{border-radius:18px;padding:14px;color:#fff;box-shadow:0 8px 20px rgba(60,20,40,.12)}
.kpi small{display:block;font-size:12px;font-weight:700;opacity:.9}
.kpi b{display:block;font-size:26px;font-weight:900;margin-top:4px}
.kpi.k1{background:linear-gradient(135deg,#ef4444,#b91c1c)}.kpi.k2{background:linear-gradient(135deg,#6366f1,#4338ca)}.kpi.k3{background:linear-gradient(135deg,#38bdf8,#0284c7)}.kpi.k4{background:linear-gradient(135deg,#34d399,#059669)}
.rk{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line)}
.rk:first-of-type{border-top:0}
.rk .n{width:20px;text-align:center;font-weight:900;color:var(--mut);font-size:13px}
.rk .who{flex:1;min-width:0}
.rk .who b{display:block;font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk .bar{height:6px;border-radius:99px;background:var(--fill);margin-top:5px;overflow:hidden}
.rk .bar i{display:block;height:100%;border-radius:99px;background:var(--bc)}
.rk .v{text-align:right;min-width:44px}
.rk .v b{display:block;font-size:18px;font-weight:900}
.rk .v small{font-size:10.5px;color:var(--mut);font-weight:600}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--mut);font-size:14px;font-weight:700;margin:2px 0 12px}
.det .vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:20px 12px}
.det .side{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;font-size:13.5px;font-weight:800}
.det .side small{color:var(--mut);font-weight:500;font-size:12px}
.det .big{font-size:32px;font-weight:900;text-align:center;white-space:nowrap}
.det .big i{font-style:normal;border-bottom:3px solid transparent}
.det .big i.w{border-bottom-color:var(--win)}
.det .pen{display:block;text-align:center;font-size:12.5px;font-weight:700;color:var(--mut);margin-top:4px}
.info{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);font-size:14px;font-weight:700}
.info svg{width:34px;height:34px;padding:7px;border-radius:10px;background:#fff1f2;stroke:var(--red);fill:none;stroke-width:2;flex-shrink:0}
.info small{display:block;color:var(--mut);font-weight:500;font-size:12px}

.tz-c{display:flex;flex-direction:column;background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 12px 30px rgba(60,20,40,.1);transition:transform .2s}

.tz-ph{height:150px;background-size:cover;background-position:center;position:relative}

.tz-c.live .tz-tag{background:var(--red);color:#fff}
.tz-tag i{width:7px;height:7px;border-radius:50%;background:#fff;animation:blink 1.2s infinite}
.tz-b{display:flex;gap:14px;padding:16px 16px 10px;align-items:flex-start}
.tz-d{width:56px;flex-shrink:0;text-align:center;border-radius:14px;background:linear-gradient(160deg,var(--red),var(--red2));color:#fff;padding:7px 0 6px;margin-top:-40px;position:relative;z-index:1;box-shadow:0 8px 18px rgba(215,25,43,.35)}
.tz-d b{display:block;font-size:24px;font-weight:900;line-height:1}
.tz-d span{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}

.tz-f{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 16px 16px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;font-weight:800;color:var(--red2)}
.tz-f .i{margin:0}
div.tz-c .tz-f{color:var(--mut);font-weight:600}
.nums{margin:44px -14px 0;padding:30px 20px;display:grid;grid-template-columns:1fr 1fr;gap:22px 16px;color:#fff;background:linear-gradient(120deg,#6f0a16,#a3101f 60%,#c3121f);position:relative;overflow:hidden}

.hist-ph span{position:absolute;left:14px;bottom:14px;background:var(--red);color:#fff;font-weight:900;font-size:13px;padding:6px 12px;border-radius:8px}
.hist-tx p{margin:0 0 12px;font-size:15px;line-height:1.6;color:#3d3542}
.tl{list-style:none;margin:18px 0 0;padding:0;border-left:2px solid #e4c9cd}
.tl li{position:relative;padding:0 0 16px 18px}
.tl li:before{content:'';position:absolute;left:-7px;top:3px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--red)}
.tl b{display:block;font-size:15px;font-weight:900;color:var(--red2)}
.tl span{font-size:14px;color:#4a4350;line-height:1.45}
.gal{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:130px;gap:8px}
.gal figure{margin:0;position:relative;border-radius:14px;overflow:hidden}
.gal img{width:100%;height:100%;object-fit:cover;transition:transform .6s}
.gal figure:hover img{transform:scale(1.06)}
.gal figcaption{position:absolute;left:0;right:0;bottom:0;padding:22px 10px 8px;font-size:12px;font-weight:800;color:#fff;background:linear-gradient(180deg,transparent,rgba(0,0,0,.6))}
.gal .g0{grid-column:span 2;grid-row:span 2}
.gal .g3{grid-column:span 2}
.soc-c{display:grid;gap:10px}
.sc{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:18px;color:#fff;box-shadow:0 10px 24px rgba(60,20,40,.12)}
.sc>svg{width:30px;height:30px;fill:none;stroke:#fff;stroke-width:2;flex-shrink:0}
.sc div{flex:1}
.sc b{display:block;font-size:16px}
.sc span{font-size:13px;opacity:.9}
.sc .i{margin:0;width:18px;height:18px}
.sc.ig{background:linear-gradient(120deg,#f58529,#dd2a7b 50%,#8134af)}
.sc.tk{background:linear-gradient(120deg,#2b2230,#3a2d40)}
.sc.wa{background:linear-gradient(120deg,#25d366,#128c7e)}
@media (min-width:700px){.hx h1{font-size:96px}.hx-in{padding:0 40px 110px}.tz{grid-template-columns:repeat(2,1fr)}.nums{grid-template-columns:repeat(4,1fr)}.hist{grid-template-columns:1fr 1.1fr;align-items:center}.hist-ph img{height:440px}.gal{grid-template-columns:repeat(4,1fr);grid-auto-rows:170px}.gal .g3{grid-column:span 2}.soc-c{grid-template-columns:repeat(3,1fr)}.hs-h h2{font-size:38px}}

const played=m=>m.hs!=null&&m.as!=null&&m.hs!==''&&m.as!=='';
function winner(m){if(m.bye)return m.h||m.a;if(!played(m))return null;if(+m.hs>+m.as)return m.h;if(+m.as>+m.hs)return m.a;if(m.hp!=null&&m.ap!=null&&m.hp!==''&&m.ap!==''){if(+m.hp>+m.ap)return m.h;if(+m.ap>+m.hp)return m.a}return null}

function standings(f,z){let rows={};z.teams.forEach(id=>rows[id]={id,z:z.name,pj:0,pg:0,pe:0,pp:0,gf:0,gc:0,pts:0});f.matches.filter(m=>played(m)&&(m.z===z.id||(m.ph==='Interzonal'&&(rows[m.h]||rows[m.a])))).forEach(m=>{let hs=+m.hs,as=+m.as;[[m.h,hs,as],[m.a,as,hs]].forEach(([id,g,c])=>{let r=rows[id];if(!r)return;r.pj++;r.gf+=g;r.gc+=c;if(g>c){r.pg++;r.pts+=3}else if(g<c)r.pp++;else{r.pe++;r.pts++}})});let list=Object.values(rows).sort((a,b)=>b.pts-a.pts),out=[],i=0;while(i<list.length){let j=i;while(j<list.length&&list[j].pts===list[i].pts)j++;let g=list.slice(i,j);if(g.length>1){let ids=g.map(r=>r.id),p={};ids.forEach(x=>p[x]=0);f.matches.filter(m=>m.z===z.id&&played(m)&&ids.includes(m.h)&&ids.includes(m.a)).forEach(m=>{if(+m.hs>+m.as)p[m.h]+=3;else if(+m.as>+m.hs)p[m.a]+=3;else{p[m.h]++;p[m.a]++}});g.sort((a,b)=>p[b.id]-p[a.id]||cmp(f)(a,b))}out.push(...g);i=j}return out}

function cutName(n){let w=String(n||'').split(/\s+/).filter(Boolean),i=0;while(i<w.length-1&&LEAD.test(w[i]))i++;return w.slice(i).join(' ')||n}
function dName(f,id){let n=tName(f,id),s=cutName(n);if(s===n)return n;let c=f._short||(f._short=Object.values(f.teams||{}).reduce((a,x)=>{let k=cutName(x.n).toLowerCase();a[k]=(a[k]||0)+1;return a},{}));return c[s.toLowerCase()]>1?n:s}

function tournament(t,flash){let cats=(t.categorias||[]).filter(c=>FX[t.id]?.[c]),head=`<section class="thead" style="--img:url(${photo(t)})"><a class="bk" href="/" data-l>${SV.l.replace('<svg','<svg width="14" height="14" style="fill:none;stroke:#fff;stroke-width:3"')} Todos los torneos</a><span class="pill ${tType(t)}">${tTypeName(t)}</span><h1>${esc(t.nombre)}</h1><div class="tmeta"><span>${IC.cal}${fmtD(t.inicio)} al ${fmtD(t.fin)}</span><span>${IC.pin}${esc(t.sede||'')}</span><a href="${mapsFor(t)}" target="_blank" rel="noopener">${IC.route} Cómo llegar</a></div></section>`;

 let tv=st.view==='partido'?'fixture':st.view;
 head+=`<div class="cats">${cats.map(c=>`<a href="${U(tv==='fixture'?'fixture':tv,null,slug(c))}" data-l class="${c===cat?'on':''}">${esc(c)}</a>`).join('')}</div><div class="stabs"><nav>${[['fixture','Fixture',SV.ball],['equipos','Equipos',SV.shirt],['posiciones','Posiciones',SV.table],['estadisticas','Estadísticas',SV.chart],['reglamento','Reglamento',SV.doc]].map(([k,n,i])=>`<a href="${U(k)}" data-l class="${tv===k?'on':''}">${i}${n}</a>`).join('')}</nav></div>`;
 let body=st.view==='posiciones'?vPos(f):st.view==='equipos'?vTeams(f):st.view==='estadisticas'?vStats(f):st.view==='reglamento'?vRegl(t):st.view==='partido'?vMatch(f,st.x):vFixture(f,flash);
 return head+body+(lastUpd?`<p class="upd">Actualizado: ${new Date(lastUpd).toLocaleString('es-AR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit',hour12:false})} hs</p>`:'')}

// Fixture con filtros dentro de la categoría: día, cancha, horario y equipo
function vFixture(f,flash){if(st._fcat!==st.cat){st._fcat=st.cat;st.field='';st.time='';st.team=''}
 let all=f.matches,days=[...new Set(all.map(m=>m.d).filter(Boolean))].sort(),today=todayISO();if(!st.day||!days.includes(st.day))st.day=days.find(d=>d>=today)||days[days.length-1]||null;let di=days.indexOf(st.day);
 const byTime=(a,b)=>(a.d||'').localeCompare(b.d||'')||(a.t||'').localeCompare(b.t||'')||(a.f||'').localeCompare(b.f||'');
 let dayMs=st.team?all.filter(m=>m.h===st.team||m.a===st.team):all.filter(m=>!days.length||m.d===st.day);
 let fields=[...new Set(dayMs.map(m=>m.f).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'es',{numeric:true})),times=[...new Set(dayMs.map(m=>m.t).filter(Boolean))].sort();
 if(st.field&&!fields.includes(st.field))st.field='';if(st.time&&!times.includes(st.time))st.time='';
 let ms=dayMs.filter(m=>(!st.field||m.f===st.field)&&(!st.time||m.t===st.time)).sort(byTime);
 let d=st.day?dISO(st.day):null,nav=days.length&&!st.team?`<div class="daynav"><button onclick="st.day='${days[di-1]||''}';st.time='';render()" ${di<=0?'disabled':''} aria-label="Día anterior">${SV.l}</button><div class="mid"><b>${DAYL[d.getDay()]} ${d.getDate()} de ${MONL[d.getMonth()].toLowerCase()}</b><small>Día ${di+1} de ${days.length}${st.day===today?' · Hoy':''} · tocá para elegir</small><select aria-label="Elegir día" onchange="st.day=this.value;st.time='';render()">${days.map((x,k)=>`<option value="${x}" ${x===st.day?'selected':''}>Día ${k+1}: ${DAYL[dISO(x).getDay()]} ${fmtD(x)}${x===today?' (hoy)':''}</option>`).join('')}</select></div><button onclick="st.day='${days[di+1]||''}';st.time='';render()" ${di>=days.length-1?'disabled':''} aria-label="Día siguiente">${SV.r}</button></div>`:'';
 const teams=Object.entries(f.teams||{}).sort((a,b)=>dName(f,a[0]).localeCompare(dName(f,b[0])));
 const sel=(key,label,list,cur)=>`<label class="flt ${cur?'on':''}"><span>${label}</span><select onchange="st.${key}=this.value;render()"><option value="">${key==='team'?'Todos':'Todas'}</option>${list.map(([v,n])=>`<option value="${esc(v)}" ${v===cur?'selected':''}>${esc(n)}</option>`).join('')}</select></label>`;
 let filters=`<div class="flts">${sel('team','Equipo',teams.map(([id])=>[id,dName(f,id)]),st.team)}${sel('field','Cancha',fields.map(x=>[x,x]),st.field)}${sel('time','Horario',times.map(x=>[x,x+' hs']),st.time)}</div>${st.team||st.field||st.time?`<button class="clr" onclick="st.team='';st.field='';st.time='';render()">Quitar filtros</button>`:''}`;
 let top=`<div class="seg"><button class="${st.mode==='horario'?'on':''}" onclick="st.mode='horario';render()">Por horario</button><button class="${st.mode==='grupo'?'on':''}" onclick="st.mode='grupo';render()">Por grupo</button></div>${nav}${filters}`;
 if(st.team)top+=`<div class="tm-h">${crest(f,st.team,true)}<div><b>${esc(tName(f,st.team))}</b><small>Todos sus partidos del torneo</small></div></div>`;
 if(!ms.length)return top+`<div class="empty"><img src="/img/cabeceando.webp" alt="">No hay partidos con esos filtros.</div>`;
 if(st.team){let ds=[...new Set(ms.map(m=>m.d||''))];return top+'<div class="cols">'+ds.map(x=>{let list=ms.filter(m=>(m.d||'')===x);return `<div class="box"><div class="box-h"><span class="zt"><i></i>${x?DAYL[dISO(x).getDay()]+' '+fmtD(x):'Sin fecha'}</span><small>${list.length} partido${list.length>1?'s':''}</small></div>${list.map(m=>row(f,m,flash,true)).join('')}</div>`}).join('')+'</div>'}
 if(st.mode==='grupo'){let keys=[...new Set(ms.map(m=>zoneName(f,m)))];return top+'<div class="cols">'+keys.map(k=>{let list=ms.filter(m=>zoneName(f,m)===k),z=f.zones.find(z=>z.name===k),free=z&&!st.field&&!st.time?z.teams.filter(id=>!list.some(m=>m.h===id||m.a===id)):[];return `<div class="box"><div class="box-h"><span class="zt" style="--zc:${zColor(f,k)}"><i></i>${esc(k)}</span><small>${list.filter(played).length}/${list.length} jugados</small></div>${list.map(m=>row(f,m,flash,false)).join('')}${free.length?`<div class="free">Sin partido este día: ${free.map(id=>`<b>${esc(dName(f,id))}</b>`).join(', ')}</div>`:''}</div>`}).join('')+'</div>'}
 let hs=[...new Set(ms.map(m=>m.t||'A definir'))];return top+'<div class="cols">'+hs.map(h=>{let list=ms.filter(m=>(m.t||'A definir')===h);return `<div class="box"><div class="box-h"><span class="zt"><i></i>${esc(h)}${h!=='A definir'?' hs':''}</span><small>${list.length} partido${list.length>1?'s':''}</small></div>${list.map(m=>row(f,m,flash,true)).join('')}</div>`}).join('')+'</div>'}

function vTeams(f){let q=st.q.trim().toLowerCase(),zoneOf=id=>f.zones?.find(z=>z.teams.includes(id))?.name||'',list=Object.entries(f.teams||{}).filter(([,x])=>!q||x.n.toLowerCase().includes(q)||String(x.c||'').toLowerCase().includes(q)).sort((a,b)=>a[1].n.localeCompare(b[1].n));

const ORD=['Primeros','Segundos','Terceros','Cuartos','Quintos','Sextos','Séptimos','Octavos'];
function table(f,rows,{zone=false,q=0}={}){return `<table><thead><tr><th>#</th><th class="tn">Equipo</th>${zone?'<th>Zona</th>':''}<th>Pts</th><th>PJ</th><th class="g">G</th><th class="wide">E</th><th class="p">P</th><th class="wide">GF</th><th class="wide">GC</th><th>DG</th></tr></thead><tbody>${rows.map((x,k)=>`<tr class="${q&&k<q?(k===0?'q1':'q2'):''}"><td class="pos">${k+1}</td><td class="tn"><div>${crest(f,x.id)}<span>${esc(dName(f,x.id))}</span></div></td>${zone?`<td class="zn" style="color:${zColor(f,x.z)}">${esc(String(x.z).replace(/^Zona\s*/i,''))}</td>`:''}<td class="pts">${x.pts}</td><td>${x.pj}</td><td>${x.pg}</td><td class="wide">${x.pe}</td><td>${x.pp}</td><td class="wide">${x.gf}</td><td class="wide">${x.gc}</td><td>${x.gf-x.gc>0?'+':''}${x.gf-x.gc}</td></tr>`).join('')}</tbody></table>`}
function vPos(f){let seg=`<div class="seg three"><button class="${st.pos==='grupos'?'on':''}" onclick="st.pos='grupos';render()">Por grupo</button><button class="${st.pos==='general'?'on':''}" onclick="st.pos='general';render()">General</button><button class="${st.pos==='puesto'?'on':''}" onclick="st.pos='puesto';render()">Por puesto</button>${f.matches.some(m=>/Copa de/.test(m.ph||''))?`<button class="${st.pos==='copas'?'on':''}" onclick="st.pos='copas';render()">Copas</button>`:''}</div>`;if(st.pos==='copas')return seg.replace('seg three','seg four')+vCups(f);if(f.matches.some(m=>/Copa de/.test(m.ph||'')))seg=seg.replace('seg three','seg four');
 if(!f.zones?.length)return seg+`<div class="empty"><img src="/img/pisando.webp" alt="">Esta categoría se juega por eliminación directa: no tiene tabla de posiciones.</div>`;
 let tabs=f.zones.map(z=>({z,rows:standings(f,z)})),q=f.format==='zonas'?f.perZone:0;
 if(st.pos==='general'){let all=tabs.flatMap(x=>x.rows).sort(cmp(f));return seg+`<div class="box"><div class="box-h"><span class="zt"><i></i>Tabla general</span><small>${all.length} equipos</small></div>${table(f,all,{zone:true})}</div><p class="upd">Todos los equipos de todas las zonas, ordenados por puntos, diferencia de gol y goles a favor.</p>`}
 if(st.pos==='puesto'){let max=Math.max(...tabs.map(x=>x.rows.length));return seg+'<div class="cols">'+Array.from({length:max},(_,k)=>{let rows=tabs.map(x=>x.rows[k]).filter(Boolean).sort(cmp(f));return `<div class="box"><div class="box-h"><span class="zt" style="--zc:${['#10b981','#f59e0b','#0ea5e9','#8b5cf6','#ec4899','#64748b'][k%6]}"><i></i>${ORD[k]||(k+1)+'.º'} de grupo</span><small>${rows.length} equipos</small></div>${table(f,rows,{zone:true})}</div>`}).join('')+`</div><p class="upd">Compara a los equipos que terminaron en el mismo puesto de cada zona.</p>`}
 return seg+'<div class="cols">'+tabs.map(({z,rows})=>`<div class="box"><div class="box-h"><span class="zt" style="--zc:${zColor(f,z.name)}"><i></i>${esc(z.name)}</span><small>${q?'Clasifican '+q:''}</small></div>${table(f,rows,{q})}</div>`).join('')+'</div>'+(q?`<div class="refs"><span><i style="background:var(--green)"></i>Primero de la zona</span><span><i style="background:var(--amber)"></i>Clasifica</span></div>`:'')}
function vStats(f){let s={};const T0=id=>s[id]=s[id]||{id,pj:0,gf:0,gc:0,vi:0};let pm=f.matches.filter(m=>played(m)&&m.h&&m.a),goals=0;pm.forEach(m=>{let a=T0(m.h),b=T0(m.a),hs=+m.hs,as=+m.as;goals+=hs+as;a.pj++;b.pj++;a.gf+=hs;a.gc+=as;b.gf+=as;b.gc+=hs;if(as===0)a.vi++;if(hs===0)b.vi++});
 let L=Object.values(s),avg=x=>(x/(pm.length||1)).toFixed(1).replace('.',','),kp=`<div class="kpis"><div class="kpi k1"><small>Partidos jugados</small><b>${pm.length}<span style="font-size:14px;opacity:.8"> / ${f.matches.filter(m=>m.h&&m.a&&!m.bye).length}</span></b></div><div class="kpi k2"><small>Goles</small><b>${goals}</b></div><div class="kpi k3"><small>Promedio por partido</small><b>${avg(goals)}</b></div><div class="kpi k4"><small>Vallas invictas</small><b>${L.reduce((a,x)=>a+x.vi,0)}</b></div></div>`;
 if(!pm.length)return kp+`<div class="empty"><img src="/img/pateando.webp" alt="">Las estadísticas aparecen cuando se juegan los primeros partidos.</div>`;
 const rank=(title,color,list,val,sub,max)=>`<div class="box"><div class="box-h"><span class="zt" style="--zc:${color}"><i></i>${title}</span><small>Top ${list.length}</small></div>${list.map((x,k)=>`<div class="rk"><span class="n">${k+1}</span>${crest(f,x.id)}<div class="who"><b>${esc(dName(f,x.id))}</b><div class="bar"><i style="width:${max?Math.max(4,val(x)/max*100):0}%;--bc:${color}"></i></div></div><div class="v"><b>${val(x)}</b><small>${sub(x)}</small></div></div>`).join('')}</div>`;
 let gf=[...L].sort((a,b)=>b.gf-a.gf||a.pj-b.pj).slice(0,8),gc=[...L].sort((a,b)=>a.gc/a.pj-b.gc/b.pj||b.pj-a.pj).slice(0,8),vi=[...L].filter(x=>x.vi).sort((a,b)=>b.vi-a.vi||a.gc-b.gc).slice(0,8),mgc=Math.max(...gc.map(x=>x.gc),1);
 return kp+'<div class="cols3">'+rank('Equipos más goleadores','#d7192b',gf,x=>x.gf,x=>'en '+x.pj+' PJ',gf[0]?.gf)+rank('Valla menos vencida','#4f46e5',gc,x=>x.gc,x=>'goles en contra',mgc)+(vi.length?rank('Vallas invictas','#10b981',vi,x=>x.vi,x=>x.vi===1?'partido sin goles':'partidos sin goles',vi[0].vi):'')+'</div>'}
function vMatch(f,key){let m=f.matches.find(x=>String(x.n??x.id)===String(key))||f.matches.find(x=>x.id===key);if(!m)return `<a class="back" href="${U('fixture')}" data-l>‹ Volver al fixture</a><div class="empty">Partido no encontrado.</div>`;let w=winner(m),pl=played(m),hn=m.h?tName(f,m.h):(m.hl||'A definir'),an=m.a?tName(f,m.a):(m.al||'A definir');
 return `<div class="det-wrap"><a class="back" href="${U('fixture')}" data-l>‹ Volver al fixture</a><div class="box det"><div class="box-h"><span class="zt" style="--zc:${zColor(f,zoneName(f,m))}"><i></i>${esc(m.ph==='Zona'?zoneName(f,m):m.ph)}</span><small>${m.d?esc(DAYL[dISO(m.d).getDay()]+' '+fmtD(m.d)):'Fecha a definir'}</small></div><div class="vs"><div class="side">${crest(f,m.h,true)}${esc(hn)}${m.h&&tCity(f,m.h)?`<small>${esc(tCity(f,m.h))}</small>`:''}</div><div><div class="big">${pl?`<i class="${w&&w===m.h?'w':''}">${esc(m.hs)}</i> - <i class="${w&&w===m.a?'w':''}">${esc(m.as)}</i>`:'<span style="font-size:17px;color:var(--red)">VS</span>'}</div>${m.hp!=null&&m.hp!==''?`<span class="pen">Penales ${esc(m.hp)} - ${esc(m.ap)}</span>`:''}</div><div class="side">${crest(f,m.a,true)}${esc(an)}${m.a&&tCity(f,m.a)?`<small>${esc(tCity(f,m.a))}</small>`:''}</div></div><div class="info">${SV.pitch}<div>${esc(m.f||'Cancha a definir')}<small>${esc(m.v||'')}</small></div></div><div class="info">${SV.clock}<div>${esc(m.t?m.t+' hs':'Horario a definir')}<small>${pl?'Partido finalizado':'Horario de inicio'}</small></div></div></div></div>`}
// Al volver a la pestaña del celular, se refresca por si se cortó la conexión
document.addEventListener('visibilitychange',async()=>{if(document.visibilityState==='visible'){try{await loadAll();if(st.t)await loadFixture(st.t);render()}catch(e){}}});
(async()=>{readPath();drawTop();try{await loadAll()}catch(e){$('#app').innerHTML='<div class="empty">No pudimos conectarnos. Revisá tu conexión e intentá de nuevo.</div>';return}route()})();
</script>
</body>
</html>
